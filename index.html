<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ふたりの家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ローディング画面 -->
<div id="loading-screen" class="loading-screen">
  <div class="loading-logo">
    <div class="loading-icon">¥</div>
    <p class="loading-text">ふたりの家計簿</p>
    <div class="loading-spinner"></div>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<!-- モーダルオーバーレイ -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>

<!-- アプリ本体 -->
<div id="app" class="app" style="display:none">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">ふたりの家計簿</h1>
      <span id="header-month" class="header-month"></span>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openSyncModal()" title="同期" aria-label="同期">
        <span class="icon">↻</span>
      </button>
      <button class="icon-btn" onclick="showPage('settings')" title="設定" aria-label="設定">
        <span class="icon">⚙</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-content" class="main-content">

    <!-- ホーム画面 -->
    <div id="page-home" class="page active">
      <!-- 月選択 -->
      <div class="month-nav">
        <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
        <span id="month-display" class="month-label"></span>
        <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
      </div>

      <!-- サマリーカード -->
      <div class="summary-grid">
        <div class="summary-card income">
          <div class="summary-label">収入</div>
          <div class="summary-amount" id="total-income">¥0</div>
        </div>
        <div class="summary-card expense">
          <div class="summary-label">支出</div>
          <div class="summary-amount" id="total-expense">¥0</div>
        </div>
        <div class="summary-card balance full-width">
          <div class="summary-label">生活費残額</div>
          <div class="summary-amount large" id="total-balance">¥0</div>
        </div>
      </div>

      <!-- 残高カード -->
      <div class="balance-row">
        <div class="balance-card">
          <div class="balance-icon">🏦</div>
          <div class="balance-info">
            <div class="balance-label">口座残高</div>
            <div class="balance-value" id="account-balance">¥0</div>
          </div>
        </div>
        <div class="balance-card savings">
          <div class="balance-icon">🐷</div>
          <div class="balance-info">
            <div class="balance-label">貯金残高</div>
            <div class="balance-value" id="savings-balance">¥0</div>
          </div>
        </div>
      </div>

      <!-- 貯金振替の扱い切り替え -->
      <div class="toggle-row">
        <label class="toggle-label">
          <span>貯金振替を支出に含める</span>
          <div class="toggle-switch">
            <input type="checkbox" id="include-savings" onchange="refreshSummary()">
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>

      <!-- 最近の取引 -->
      <div class="section-header">
        <h2 class="section-title">最近の取引</h2>
        <button class="text-btn" onclick="showPage('transactions')">すべて見る</button>
      </div>
      <div id="recent-transactions" class="transaction-list">
        <div class="empty-state">取引がありません</div>
      </div>
    </div>

    <!-- 取引一覧画面 -->
    <div id="page-transactions" class="page">
      <div class="page-header">
        <h2 class="page-title">取引一覧</h2>
        <div class="filter-row">
          <select id="filter-type" class="filter-select" onchange="renderTransactions()">
            <option value="">すべて</option>
            <option value="収入">収入</option>
            <option value="支出">支出</option>
            <option value="振替">振替</option>
          </select>
          <select id="filter-person" class="filter-select" onchange="renderTransactions()">
            <option value="">全員</option>
            <option value="ゆみか">ゆみか</option>
            <option value="かんた">かんた</option>
          </select>
        </div>
      </div>
      <div id="all-transactions" class="transaction-list"></div>
    </div>

    <!-- 集計画面 -->
    <div id="page-stats" class="page">
      <div class="page-header">
        <h2 class="page-title">集計</h2>
      </div>

      <div class="stats-tabs">
        <button class="stats-tab active" onclick="switchStatsTab('category', this)">カテゴリ別</button>
        <button class="stats-tab" onclick="switchStatsTab('person', this)">入力者別</button>
        <button class="stats-tab" onclick="switchStatsTab('monthly', this)">月別推移</button>
      </div>

      <div id="stats-content" class="stats-content"></div>
    </div>

    <!-- 設定画面 -->
    <div id="page-settings" class="page">
      <div class="page-header">
        <h2 class="page-title">設定</h2>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">接続設定</h3>
        <div class="settings-item">
          <label class="settings-label">Apps Script URL</label>
          <input type="url" id="api-url-input" class="settings-input" placeholder="https://script.google.com/macros/s/..." value="">
        </div>
        <button class="btn-primary" onclick="saveApiUrl()">URLを保存して接続</button>
        <button class="btn-secondary" onclick="testConnection()">接続テスト</button>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">カテゴリ管理</h3>
        <div id="category-list" class="manage-list"></div>
        <button class="btn-add" onclick="openAddCategory()">＋ カテゴリを追加</button>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">支払い元管理</h3>
        <div id="payment-method-list" class="manage-list"></div>
        <button class="btn-add" onclick="openAddPaymentMethod()">＋ 支払い元を追加</button>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">固定費管理</h3>
        <div id="fixed-cost-list" class="manage-list"></div>
        <button class="btn-add" onclick="openAddFixedCost()">＋ 固定費を追加</button>
        <button class="btn-secondary" style="margin-top:8px" onclick="applyFixedCosts()">今月の固定費を反映</button>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">テーマ</h3>
        <div class="theme-toggle-row">
          <span>ダークモード</span>
          <div class="toggle-switch">
            <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this.checked)">
            <span class="toggle-slider"></span>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h3 class="settings-heading">データ管理</h3>
        <button class="btn-secondary" onclick="forceSync()">スプレッドシートから再読み込み</button>
        <button class="btn-danger" onclick="clearLocalCache()">ローカルキャッシュを削除</button>
      </div>
    </div>

  </main>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('home')" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">ホーム</span>
    </button>
    <button class="nav-btn" onclick="showPage('transactions')" data-page="transactions">
      <span class="nav-icon">📋</span>
      <span class="nav-label">履歴</span>
    </button>
    <button class="nav-fab" onclick="openAddTransaction()" aria-label="取引を追加">
      <span class="fab-icon">＋</span>
    </button>
    <button class="nav-btn" onclick="showPage('stats')" data-page="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">集計</span>
    </button>
    <button class="nav-btn" onclick="showPage('settings')" data-page="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">設定</span>
    </button>
  </nav>

</div><!-- /app -->

<!-- ===== モーダル: 取引入力 ===== -->
<div id="modal-transaction" class="modal">
  <div class="modal-header">
    <h3 class="modal-title" id="modal-tx-title">取引を追加</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="tx-id">

    <!-- 種別タブ -->
    <div class="type-tabs">
      <button class="type-tab active" data-type="支出" onclick="selectType('支出', this)">支出</button>
      <button class="type-tab" data-type="収入" onclick="selectType('収入', this)">収入</button>
      <button class="type-tab" data-type="振替" onclick="selectType('振替', this)">振替</button>
    </div>

    <!-- 金額（大きく表示） -->
    <div class="amount-input-wrap">
      <span class="amount-prefix">¥</span>
      <input type="number" id="tx-amount" class="amount-input" placeholder="0" inputmode="numeric" min="0">
    </div>

    <!-- 通常フィールド群 -->
    <div id="normal-fields">
      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="date" id="tx-date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">入力者</label>
          <select id="tx-person" class="form-select">
            <option value="ゆみか">ゆみか</option>
            <option value="かんた">かんた</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">カテゴリ</label>
        <select id="tx-category" class="form-select"></select>
      </div>

      <div class="form-group">
        <label class="form-label">支払い元</label>
        <select id="tx-payment" class="form-select"></select>
      </div>
    </div>

    <!-- 振替フィールド群 -->
    <div id="transfer-fields" style="display:none">
      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="date" id="tx-date-t" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">入力者</label>
          <select id="tx-person-t" class="form-select">
            <option value="ゆみか">ゆみか</option>
            <option value="かんた">かんた</option>
          </select>
        </div>
      </div>
      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label">振替元</label>
          <select id="tx-transfer-from" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">振替先</label>
          <select id="tx-transfer-to" class="form-select"></select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">カテゴリ</label>
        <select id="tx-category-t" class="form-select"></select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">メモ <span class="optional">任意</span></label>
      <input type="text" id="tx-memo" class="form-input" placeholder="メモを入力...">
    </div>

    <button class="btn-submit" id="tx-submit-btn" onclick="submitTransaction()">登録する</button>
  </div>
</div>

<!-- ===== モーダル: カテゴリ追加/編集 ===== -->
<div id="modal-category" class="modal">
  <div class="modal-header">
    <h3 class="modal-title" id="modal-cat-title">カテゴリを追加</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="cat-original-name">
    <div class="form-group">
      <label class="form-label">カテゴリ名</label>
      <input type="text" id="cat-name" class="form-input" placeholder="カテゴリ名">
    </div>
    <div class="form-group">
      <label class="form-label">種別</label>
      <select id="cat-type" class="form-select">
        <option value="">共通</option>
        <option value="収入">収入</option>
        <option value="支出">支出</option>
        <option value="振替">振替</option>
      </select>
    </div>
    <button class="btn-submit" onclick="saveCategory()">保存</button>
  </div>
</div>

<!-- ===== モーダル: 支払い元追加/編集 ===== -->
<div id="modal-payment" class="modal">
  <div class="modal-header">
    <h3 class="modal-title" id="modal-pm-title">支払い元を追加</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="pm-original-name">
    <div class="form-group">
      <label class="form-label">支払い元名</label>
      <input type="text" id="pm-name" class="form-input" placeholder="支払い元名">
    </div>
    <div class="form-group">
      <label class="form-label">種別</label>
      <select id="pm-type" class="form-select">
        <option value="口座">口座</option>
        <option value="クレジット">クレジット</option>
        <option value="電子マネー">電子マネー</option>
        <option value="貯金">貯金</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">初期残高</label>
      <input type="number" id="pm-balance" class="form-input" placeholder="0" value="0">
    </div>
    <button class="btn-submit" onclick="savePaymentMethod()">保存</button>
  </div>
</div>

<!-- ===== モーダル: 固定費追加/編集 ===== -->
<div id="modal-fixed" class="modal">
  <div class="modal-header">
    <h3 class="modal-title" id="modal-fc-title">固定費を追加</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="fc-id">
    <div class="form-group">
      <label class="form-label">名称</label>
      <input type="text" id="fc-name" class="form-input" placeholder="例：家賃">
    </div>
    <div class="form-row two-col">
      <div class="form-group">
        <label class="form-label">カテゴリ</label>
        <select id="fc-category" class="form-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">支払い元</label>
        <select id="fc-payment" class="form-select"></select>
      </div>
    </div>
    <div class="form-row two-col">
      <div class="form-group">
        <label class="form-label">金額</label>
        <input type="number" id="fc-amount" class="form-input" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">毎月反映日</label>
        <select id="fc-day" class="form-select">
          <!-- 1-28 will be populated by JS -->
        </select>
      </div>
    </div>
    <button class="btn-submit" onclick="saveFixedCost()">保存</button>
  </div>
</div>

<!-- ===== モーダル: 同期 ===== -->
<div id="modal-sync" class="modal">
  <div class="modal-header">
    <h3 class="modal-title">データ同期</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <p class="sync-desc">スプレッドシートとデータを同期します。</p>
    <div id="sync-status" class="sync-status"></div>
    <button class="btn-submit" onclick="syncData()">今すぐ同期</button>
  </div>
</div>

<!-- ===== 確認ダイアログ ===== -->
<div id="modal-confirm" class="modal">
  <div class="modal-header">
    <h3 class="modal-title" id="confirm-title">確認</h3>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <p id="confirm-message" class="confirm-message"></p>
    <div class="confirm-buttons">
      <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn-danger" id="confirm-ok-btn">削除する</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
